[package]
name = "clipmagic"
version = "0.1.0"
description = "ClipMagic Local AI Video Clipping Studio"
authors = ["ClipMagic"]
edition = "2021"

[lib]
name = "clipmagic_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
